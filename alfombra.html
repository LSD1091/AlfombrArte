<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfombra · Trufing</title>
  <meta name="robots" content="noindex">
  <!-- Las fichas ahora viven en alfombras/<id>/. Esta página redirige los enlaces antiguos alfombra.html?id=<id>. -->
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("id");
      location.replace(id && /^[a-z0-9-]+$/.test(id) ? "alfombras/" + id + "/" : "catalogo.html");
    })();
  </script>
</head>
<body>
  <p>Esta página se ha movido. <a href="catalogo.html">Ver el catálogo</a>.</p>
</body>
</html>
